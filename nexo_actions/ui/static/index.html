<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#020408">
  <title>Nexo — Assistente em Tempo Real</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body data-state="idle">
  <canvas id="hologram" aria-hidden="true"></canvas>
  <div class="aurora aurora-a" aria-hidden="true"></div>
  <div class="aurora aurora-b" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>

  <main class="shell">
    <header class="topbar">
      <div class="identity">
        <span class="sigil" aria-hidden="true"><i></i></span>
        <div>
          <strong>NEXO</strong>
          <small>REALTIME INTELLIGENCE</small>
        </div>
      </div>
      <div class="system-meta">
        <span class="connection"><i></i><b id="connectionLabel">CONECTANDO</b></span>
        <time id="clock">00:00:00</time>
      </div>
    </header>

    <section class="core" aria-live="polite">
      <div class="reticle reticle-outer" aria-hidden="true"></div>
      <div class="reticle reticle-inner" aria-hidden="true"></div>
      <div class="axis axis-x" aria-hidden="true"></div>
      <div class="axis axis-y" aria-hidden="true"></div>

      <div class="orb-space" aria-hidden="true">
        <div class="orb-glow"></div>
        <div class="orb-ring ring-a"></div>
        <div class="orb-ring ring-b"></div>
        <div class="orb-ring ring-c"></div>
        <div class="orb-seed"><i></i></div>
      </div>

      <div class="readout">
        <div class="state-line"><span></span><b id="stateLabel">DISPONÍVEL</b><span></span></div>
        <p id="stateDetail">Diga “Nexo” para começar</p>
        <p id="transcript" class="transcript" hidden></p>
        <div id="sources" class="sources" hidden aria-label="Fontes da resposta"></div>
        <div class="progress" id="progress" hidden><i></i></div>
      </div>
    </section>

    <footer class="console">
      <form id="commandForm" autocomplete="off">
        <label for="commandInput">Canal de texto</label>
        <div class="command-field">
          <span class="prompt">›</span>
          <input id="commandInput" name="command" maxlength="1200" placeholder="Fale naturalmente ou digite um pedido…">
          <button type="submit" aria-label="Enviar pedido">ENVIAR <span>↗</span></button>
        </div>
      </form>
      <div class="footer-status">
        <button id="micSensor" type="button" title="Ativar reação visual ao microfone">
          <i></i><span>SENSOR DE VOZ</span>
        </button>
        <div class="privacy"><span>● CHAVE PROTEGIDA</span><span>● AÇÕES CONFIRMADAS</span><span>● CONTROLE LOCAL</span></div>
      </div>
    </footer>
  </main>

  <noscript>Ative JavaScript para visualizar o holograma do Nexo.</noscript>
  <script src="/app.js" defer></script>
</body>
</html>
