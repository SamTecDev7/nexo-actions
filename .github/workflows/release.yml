name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate immutable release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate exact SemVer and source versions
        run: python3 scripts/ci_validate_version.py --tag "${GITHUB_REF_NAME}"

  quality:
    name: Test and build release candidate
    needs: validate-tag
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  publish:
    name: Publish GitHub release
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: github-release
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate tag against source versions
        run: python scripts/ci_validate_version.py --tag "${GITHUB_REF_NAME}"

      - name: Download validated Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nexo-windows-${{ github.sha }}
          path: release

      - name: Revalidate and generate checksums
        run: |
          python scripts/ci_validate_artifacts.py \
            --directory release \
            --require-launcher \
            --require-installer \
            --source-commit "${GITHUB_SHA}" \
            --verify-manifest release/ReleaseManifest.json
          cd release
          sha256sum Nexo.exe NexoSetup.exe > SHA256SUMS.txt

      - name: Refuse to overwrite an existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "::error::A release ${GITHUB_REF_NAME} já existe; nenhum artefato foi sobrescrito."
            exit 1
          fi

      - name: Publish immutable tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/Nexo.exe \
            release/NexoSetup.exe \
            release/ReleaseManifest.json \
            release/SHA256SUMS.txt \
            --verify-tag \
            --generate-notes \
            --title "Nexo ${GITHUB_REF_NAME}"
